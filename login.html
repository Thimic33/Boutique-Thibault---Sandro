<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page login</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(#64759D, #826092, #E39986);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .popup {
            border: 5px solid #E39986;
            border-radius: 30px;
            height: 500px;
            width: 500px;
            text-align: center;
            background-color: rgba(42, 42, 64, 0.6);
        }

        .connect {
            margin-top: 30px;
        }

        .champ:hover {
            transform: scale(1.05);
        }

        .nom {
            margin-top: 50px;
            padding: 20px;
            height: 50px;
        }

        .champ {
            margin: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }

        input {
            width: 220px;
            padding: 12px;
            border: 2px solid #E39986;
            border-radius: 10px;
            background-color: #1e1e2f;
            color: white;
            font-size: 16px;
        }

        button {
            background-color: #E39986;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        button:hover {
            transform: scale(1.05);
        }

        button:hover {
            background-color: #ffaa00;
        }
    </style>
</head>

<body>

    <div class="popup">

        <div class="connect">
            <h1>Connectez-vous</h1>
        </div>

        <div class="nom">

            <div class="champ">
                <input type="text" id="username" placeholder="Votre pseudo">
            </div>

            <div class="champ">
                <input type="password" id="password" placeholder="Votre mot de passe">
            </div>

            <button type="button"><a href="index.html">Se connecter</a></button>

        </div>

    </div>

</body>
</html>
